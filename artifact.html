<title>Site Commissioning App</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#f4f5f2; --panel:#ffffff; --panel2:#eef0eb; --ink:#1b2a35; --mute:#5d6b74; --line:#d9ddd5;
  --navy:#12303f; --navy-ink:#ffffff; --accent:#d98a00; --accent-ink:#ffffff;
  --ok:#17803f; --ok-bg:#dff3e5; --bad:#c0262d; --bad-bg:#fbe0e1; --warn:#a86a00; --warn-bg:#fdecc4; --na:#6a7780; --na-bg:#e6e9e6;
  --focus:#1d6fb8; --shadow:0 1px 2px rgba(18,48,63,.08),0 4px 14px rgba(18,48,63,.06);
  --sans:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif; --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1a21; --panel:#172630; --panel2:#1e303b; --ink:#e7edf0; --mute:#97a8b2; --line:#2c424f;
  --navy:#0a1318; --navy-ink:#e7edf0; --accent:#f0a830; --accent-ink:#1b1200;
  --ok:#4cc27d; --ok-bg:#16382a; --bad:#ff7a80; --bad-bg:#44201f; --warn:#f0b64a; --warn-bg:#41330f; --na:#9aa9b2; --na-bg:#23343e;
  --focus:#6db3f0; --shadow:0 1px 2px rgba(0,0,0,.4);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1a21; --panel:#172630; --panel2:#1e303b; --ink:#e7edf0; --mute:#97a8b2; --line:#2c424f;
  --navy:#0a1318; --navy-ink:#e7edf0; --accent:#f0a830; --accent-ink:#1b1200;
  --ok:#4cc27d; --ok-bg:#16382a; --bad:#ff7a80; --bad-bg:#44201f; --warn:#f0b64a; --warn-bg:#41330f; --na:#9aa9b2; --na-bg:#23343e;
  --focus:#6db3f0; --shadow:0 1px 2px rgba(0,0,0,.4);color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.45 var(--sans);-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;text-wrap:balance}
#app{min-height:100vh}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--navy);color:var(--navy-ink);padding:10px 16px;display:flex;align-items:center;gap:12px}
.topbar .btn{color:var(--ink)}
.topbar .brand{font-weight:700;letter-spacing:.02em;display:flex;align-items:center;gap:8px;min-width:0}
.topbar .sun{width:30px;height:30px;flex:none;object-fit:contain}
.logohead{display:flex;align-items:center;gap:18px;min-width:0}
.logohead>div{min-width:0}
.hlogo{height:76px;width:auto;flex:none}
@media (max-width:480px){.hlogo{height:58px}.logohead{gap:12px}}
.topbar .ttl{min-width:0;flex:1}
.topbar .ttl b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:15px}
.topbar .ttl small{display:block;opacity:.7;font-size:11.5px;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar{min-height:54px;max-height:54px;overflow:hidden}
.save{font-size:11.5px;opacity:.8;white-space:nowrap}
.tabs{position:sticky;top:calc(env(safe-area-inset-top,0px) + 54px);z-index:15;background:var(--panel);border-bottom:1px solid var(--line);display:flex;gap:2px;overflow-x:auto;padding:0 8px;scrollbar-width:thin}
.tab{flex:none;border:0;background:none;padding:11px 12px;cursor:pointer;color:var(--mute);font-weight:500;border-bottom:3px solid transparent;display:flex;align-items:center;gap:6px;white-space:nowrap}
.tab[aria-selected=true]{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
.dot{width:8px;height:8px;border-radius:50%;background:var(--line);display:inline-block}
.dot.ok{background:var(--ok)}.dot.bad{background:var(--bad)}.dot.warn{background:var(--accent)}.dot.na{background:var(--na-bg);outline:1px solid var(--line)}
main{max-width:1060px;margin:0 auto;padding:18px 16px 90px;display:flex;flex-direction:column;gap:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;box-shadow:var(--shadow);min-width:0}
.card>h2,.sech{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--mute);font-weight:700;margin-bottom:10px}
.pagehead{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;justify-content:space-between}
.pagehead h1{font-size:21px}
.pagehead p{margin:2px 0 0;color:var(--mute);max-width:62ch}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.g.c2{grid-template-columns:repeat(2,minmax(0,1fr))}.g.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g.wide{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.f{display:flex;flex-direction:column;gap:3px;min-width:0}
.f>span{font-size:11.5px;color:var(--mute);font-weight:500}
.f.full{grid-column:1/-1}
input[type=text],input[type=date],input[type=time],input[type=email],input[type=tel],select,textarea{width:100%;min-width:0;background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:8px 9px;min-height:38px}
input.mono,.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
textarea{resize:vertical;min-height:60px}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--focus);outline-offset:1px}
.hint{font-size:11.5px;color:var(--mute)}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:8px 13px;cursor:pointer;font-weight:600;min-height:38px;display:inline-flex;gap:6px;align-items:center;justify-content:center}
.btn:hover{background:var(--panel2)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.pri:hover{filter:brightness(1.07)}
.btn.nav{background:var(--navy);color:var(--navy-ink);border-color:transparent}
.btn.sm{padding:4px 9px;min-height:30px;font-size:12.5px}
.btn.danger{color:var(--bad)}
.btn[disabled]{opacity:.5;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.row.sp{justify-content:space-between}
.bdg{display:inline-block;min-width:64px;text-align:center;padding:2px 9px;border-radius:99px;font-size:11.5px;font-weight:700;letter-spacing:.03em}
.bdg.ok{background:var(--ok-bg);color:var(--ok)}.bdg.bad{background:var(--bad-bg);color:var(--bad)}
.bdg.warn{background:var(--warn-bg);color:var(--warn)}.bdg.na,.bdg.none{background:var(--na-bg);color:var(--na)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel)}
.seg button{border:0;background:none;padding:6px 12px;min-height:34px;cursor:pointer;font-weight:600;color:var(--mute);border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button.on.p{background:var(--ok-bg);color:var(--ok)}.seg button.on.f{background:var(--bad-bg);color:var(--bad)}.seg button.on.n{background:var(--na-bg);color:var(--ink)}
.seg button.on.o{background:var(--accent);color:var(--accent-ink)}
.item{border-top:1px solid var(--line);padding:9px 0;display:grid;grid-template-columns:28px 1fr;gap:4px 8px}
.item:first-child{border-top:0}
.item .no{color:var(--mute);font-family:var(--mono);font-size:12px;padding-top:2px}
.item .ctl{grid-column:2;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.item .ctl input{flex:1;min-width:140px}
.rc{border:1px solid var(--line);border-radius:9px;padding:11px;background:var(--panel2);display:flex;flex-direction:column;gap:9px}
.rc>header{display:flex;gap:8px;align-items:center;justify-content:space-between}
.rc>header b{font-size:13px}
.rcs{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(330px,1fr))}
.rc .f input,.rc .f select{background:var(--panel)}
.grp{display:grid;gap:3px}
.grp>legend{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}
fieldset{border:0;margin:0;padding:0;min-width:0}
.pills{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.pill{flex:none;border:1px solid var(--line);background:var(--panel);border-radius:99px;padding:5px 13px;cursor:pointer;font-weight:600;display:flex;gap:7px;align-items:center}
.pill[aria-pressed=true]{background:var(--navy);color:var(--navy-ink);border-color:var(--navy)}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--mute);text-align:left;padding:6px 8px;border-bottom:2px solid var(--line)}
table.t td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
table.t td.n,table.t th.n{text-align:right;font-variant-numeric:tabular-nums;font-family:var(--mono)}
.scroll{overflow-x:auto}
.ovr{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between}
.ovr .big{font-size:26px;font-weight:700;letter-spacing:.02em}
.bar{height:8px;border-radius:5px;background:var(--panel2);overflow:hidden;display:flex;min-width:120px}
.bar i{display:block;height:100%}
.bar .a{background:var(--ok)}.bar .b{background:var(--bad)}.bar .c{background:var(--accent)}
.proj{display:flex;flex-direction:column;gap:6px;cursor:pointer;text-align:left}
.projs{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
.empty{padding:26px;text-align:center;color:var(--mute)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--navy);color:var(--navy-ink);padding:10px 16px;border-radius:9px;box-shadow:var(--shadow);z-index:50;max-width:90vw}
.nextbar{display:flex;justify-content:space-between;gap:8px}
.callout{border-left:4px solid var(--accent);background:var(--panel2);padding:9px 12px;border-radius:0 8px 8px 0;color:var(--mute);font-size:13px}
.kpi{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--mute)}
.kpi b{color:var(--ink);font-family:var(--mono);font-variant-numeric:tabular-nums}
details.rc>summary{cursor:pointer;font-weight:600}
table.t .seg button{padding:4px 9px;min-height:30px}
@media (max-width:560px){table.t td,table.t th{padding:6px 4px}.g.c3{gap:6px}.tab{padding:10px 9px}.rcs{grid-template-columns:1fr}}
</style>
<div id="app"></div>
<div id="toast" class="toast" hidden></div>
<script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
<script>
'use strict';
/* ================= helpers ================= */
const $ = (s, e = document) => e.querySelector(s);
const $$ = (s, e = document) => [...e.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Math.random().toString(36).slice(2, 8) + Date.now().toString(36).slice(-4);
const today = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
const nowT = () => { const d = new Date(); return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); };
const get = (o, p) => p.split('.').reduce((a, k) => (a == null ? a : a[k]), o);
function set(o, p, v) { const ks = p.split('.'); const last = ks.pop(); const t = ks.reduce((a, k) => a[k], o); t[last] = v; }
// Reading parser: '>999' -> 999, 'OL' (over-range) -> Infinity, '1,000' -> 1000, '0,5' -> 0.5, '230V' -> 230
const num = v => {
  if (v == null) return NaN;
  let s = String(v).trim().replace(/^[>≥<≤~]\s*/, '');
  if (/^(OL|O\.L\.?|OVER|INF|∞)$/i.test(s)) return Infinity;
  if (/^-?\d{1,3}(,\d{3})+(\.\d+)?(\D.*)?$/.test(s)) s = s.replace(/,/g, ''); else s = s.replace(',', '.');
  return s === '' ? NaN : parseFloat(s);
};
const isN = v => isFinite(num(v));          // finite number (voltages, temperatures, Voc …)
const isIns = v => !isNaN(num(v));          // insulation readings may be over-range (Infinity)
const grpKey = v => String(v ?? '').trim().toLowerCase().replace(/^0+(?=\d)/, '');
const filled = v => v != null && String(v).trim() !== '';
const r2 = (x, d = 2) => (isFinite(x) ? (Math.round(x * 10 ** d) / 10 ** d).toString() : '');
const dFmt = s => { if (!s) return ''; const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(s); if (!m) return s; const mo = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'][+m[2] - 1]; return m[3] + '-' + mo + '-' + m[1]; };

/* ================= static content ================= */
const VIS = [
  ['A. PV Modules & Mounting Structure', ['Modules free of physical damage (cracks, hot spots, delamination)', 'Modules clean and free of shading obstructions', 'Mounting structure secure, level and correctly torqued', 'Module clamps / bolts torqued to spec, no loose fixings', 'Structure and module frames bonded to earthing system']],
  ['B. DC Cabling', ['DC cables routed and dressed neatly, no sharp bends', 'Cables secured with UV-rated cable ties / clips', 'MC4 (or equivalent) connectors fully locked, no exposed conductor', 'String / cable labelling complete and legible', 'Cable entry points and conduits sealed (IP rated)']],
  ['C. Inverter & DC Protection', ['Inverter securely mounted, correct orientation and clearance', 'Ventilation / cooling clearance around inverter as per manual', 'Cable glands sealed, unused entries blanked off', 'DC surge protection device (SPD) fitted and indicator normal', 'DC isolator / switch labelled and operates freely', 'Inverter display / status LEDs functioning normally']],
  ['D. AC Side & Main Panel', ['AC cable terminations tight and correctly torqued', 'AC circuit breaker rating matches design / datasheet', 'AC isolator accessible and labelled', 'AC cable and circuit labelling complete', 'Energy meter / CT connections correct and secure']],
  ['E. Earthing & Lightning Protection', ['Earth pit(s) installed and accessible for testing', 'Earth cable size / type as per design', 'Equipotential bonding complete across all metallic parts', 'Lightning / surge protection installed where specified']],
  ['F. Safety & Signage', ['Danger / warning labels posted at DC & AC points', 'Single line diagram (SLD) posted at site / inverter room', 'Fire extinguisher (CO2 / DCP, rated for electrical) available', 'PPE available for O&M personnel', 'Emergency shutdown procedure posted']]
];
const VIS_FLAT = []; VIS.forEach((g, gi) => g[1].forEach(t => VIS_FLAT.push({ g: gi, t })));
const PROT = [
  ['Over Voltage Protection Trip (V)', 'e.g. 253'], ['Under Voltage Protection Trip (V)', 'e.g. 195'], ['Over Frequency Protection Trip (Hz)', 'e.g. 52'],
  ['Under Frequency Protection Trip (Hz)', 'e.g. 47.5'], ['Anti-Islanding Protection Test', 'Tripped in __ s'], ['Reconnection Time Delay (s)', 'e.g. 60'],
  ['Export Power Limit Setting (kW / %)', 'e.g. 0 kW zero export'], ['RCD / ELCB Rated Trip Current (mA)', 'e.g. 30'], ['RCD / ELCB Trip Test Result', 'Trip time (ms)'],
  ['Earth Fault Protection Test', ''], ['Remote Shutdown / Emergency Stop Test', ''], ['Communication Module (WiFi / 4G / RS485) Test', ''],
  ['Monitoring Portal Registration', 'Portal / plant ID'], ['Inverter Firmware Version(s)', 'e.g. V100R001C00']
];
const BPARAMS = ['Over Voltage Protection (V)', 'Under Voltage Protection (V)', 'Over Current Protection (A)', 'Over Temperature Protection (°C)', 'Under Temperature Protection (°C)', 'Cell Balancing Function Test', 'SOC Display Accuracy', 'BMS Communication / Monitoring Test', 'Battery Emergency Shutdown Test'];
const BTESTS = ['Charge Test', 'Discharge Test', 'Backup / Off-Grid Test (grid failure simulation)'];
const EQUIP = [['Insulation Resistance Tester', 'DC & AC insulation tests'], ['Digital Multimeter / Clamp Meter', 'Voltage, current, polarity'], ['PV String Tester / I-V Curve Tracer', 'Voc, Isc, string current'], ['Digital Earth Tester', 'Earthing test'], ['Thermal Imaging Camera', 'Panels, inverters, switchgear'], ['Power / Energy Analyser', 'AC output, PF, frequency'], ['Irradiance Meter', 'Irradiance during on-load tests'], ['Other', '']];
const HANDOVER = ['As-built drawings provided', 'O&M manual provided', 'Warranty certificates provided', 'Spare parts list provided', 'O&M training conducted', 'Monitoring portal access provided', 'Test certificates / thermal images attached'];
const ROLES = ['Commissioning Engineer', 'QA / QC Engineer', 'Client Representative / Consultant', 'Site Safety Officer'];
const LIMDEF = [
  ['insdc', 'DC insulation resistance — minimum', 1, 'MΩ'], ['insac', 'AC insulation resistance — minimum', 1, 'MΩ'], ['vocdev', 'String Voc deviation within same MPPT / module count — maximum', 5, '%'],
  ['earth', 'Earth resistance — maximum', 5, 'Ω'], ['vnom', 'Nominal phase voltage (L–N)', 230, 'V'], ['vtol', 'Voltage tolerance (±)', 10, '%'],
  ['fnom', 'Nominal frequency', 50, 'Hz'], ['ftol', 'Frequency tolerance (±)', 1, 'Hz'], ['dt', 'Thermal ΔT above ambient — maximum', 20, '°C']
];
const CO = { name: 'Regen Renewables (Pvt) Ltd.', line: 'Regen Renewables (Pvt) Ltd.   ·   31/10 Castle Street, Colombo 8, Sri Lanka   ·   regen.lk', notice: '© Regen Renewables (Pvt) Ltd. All rights reserved. This document is confidential and the property of Regen Renewables (Pvt) Ltd. It must not be copied, shared or used without written permission.' };

/* ================= data model ================= */
const newStr = (m = '', s = '', mods = '') => ({ id: uid(), mppt: m, str: s, mods, voc: '', ip: '', in: '', ipn: '', pol: '', opv: '', cur: '', rem: '' });
const newInv = (n, P) => ({ id: uid(), loc: '', make: '', model: '', sn: '', kw: '', spd: '', spd_model: '', iso_qty: '', iso_rating: '', dc_cable: '', ac_iso: '', ac_iso_rating: '', rem: '', by: P ? P.info.engineer : '', dt: today() + ' ' + nowT(), wx: '', strings: [] });
const newAc = () => ({ pt: '', time: '', v1: '', v2: '', v3: '', i1: '', i2: '', i3: '', kw: '', pf: '', hz: '', rem: '' });
const newAcIns = () => ({ pt: '', v: Array(10).fill(''), rem: '' });
const newEarth = () => ({ loc: '', val: '', rem: '' });
const newPan = () => ({ where: '', sn: '', time: '', t: '', c: '' });
const newThInv = () => ({ where: '', pt: '', time: '', t: '', c: '' });
const newSw = () => ({ where: '', rating: '', time: '', tin: '', tout: '', c: '' });
const newBMod = () => ({ mod: '', str: '', vn: '', vm: '', ins: '', s: '', rem: '' });
const newPunch = () => ({ date: today(), loc: '', issue: '', cat: '', by: '', action: '', resp: '', target: '', s: 'Open', closed: '' });

function newProject() {
  const d = today();
  return {
    id: 'p' + uid(), v: 1, created: Date.now(), updated: Date.now(),
    info: { name: '', docno: '', rev: 'Rev 0', address: '', date: d, contact: '', tel_fixed: '', tel_mobile: '', email: '', weather: '', bill: '', client: '', epc: '', engineer: '', inv_model: '', ninv: '', kwp: '', kwac: '', roof: '', conn: '', voltage: '', supplier: '', branch: '', account: '', itype: 'Grid-tied', pv_model: '', pv_wp: '', pv_vv: '', pv_ii: '', npan: '', nstr: '', prep: '', rev_by: '', appr: '', appr_date: '' },
    lim: Object.fromEntries(LIMDEF.map(l => [l[0], String(l[2])])),
    equip: EQUIP.map((e, i) => ({ name: e[0], model: i === 3 ? '4105A / KYORITSU' : '', sn: '', cal: '', due: '', use: e[1] })),
    vis: VIS_FLAT.map(() => ({ s: '', r: '' })), vis_by: '', vis_date: d,
    invs: [], panel: { loc: '', brk: '', brk_a: '', ip: '', ac_spd: '', meter: '', meter_sn: '', ct: '', rcd: '', cable_inv: '', cable_util: '', earth: '' },
    ac: { date: d, by: '', rows: [Object.assign(newAc(), { pt: 'Grid side (no load)' })], officer: '' }, total_kw: '',
    acins: { date: d, volt: '500', by: '', rows: [newAcIns()], earth: [newEarth()], officer: '' },
    th: { date: d, amb: '', irr: '', by: '', pan: [newPan()], inv: [newThInv()], sw: [Object.assign(newSw(), { where: 'Main Breaker' })], officer: '' },
    bat: { brand: '', type: '', kwh: '', vn: '', mods: '', strs: '', bms: '', by: '', mod: [newBMod()], prm: BPARAMS.map(() => ({ val: '', std: '', s: '', rem: '' })), tests: BTESTS.map(() => ({ t0: '', t1: '', soc: '', volt: '', cur: '', dur: '', rem: '' })), officer: '' },
    prot: PROT.map(() => ({ val: '', std: '', s: '', rem: '' })), prot_by: '', prot_date: d,
    pser: [], photos: [],
    punch: [], sign: { date: d, officer: '', roles: ROLES.map(() => ({ name: '', co: '', date: '' })), hand: HANDOVER.map(() => ''), comments: '' },
    applic: { battery: 'No' }
  };
}

/* ================= engineering calculations (mirror the Excel workbook) ================= */
let P = null; // current project
const L = k => { const v = num(P.lim[k]); return !isFinite(v) ? ({ insdc: 1, insac: 1, vocdev: 5, earth: 5, vnom: 230, vtol: 10, fnom: 50, ftol: 1, dt: 20 }[k]) : v; };

function dcDev(inv, j) {
  const s = inv.strings[j]; if (!isN(s.voc)) return NaN;
  let grp;
  if (filled(s.mppt) && isN(s.mods)) grp = inv.strings.filter(x => grpKey(x.mppt) === grpKey(s.mppt) && num(x.mods) === num(s.mods) && isN(x.voc));
  else grp = inv.strings.filter(x => isN(x.voc));
  if (!grp.length) return NaN;
  const avg = grp.reduce((a, x) => a + num(x.voc), 0) / grp.length;
  return avg ? (num(s.voc) / avg - 1) * 100 : NaN;
}
function dcRes(inv, j) {
  const s = inv.strings[j];
  const any = [s.voc, s.ip, s.in, s.ipn, s.pol, s.opv, s.cur].some(filled);
  if (!any) return '';
  const ins = [s.ip, s.in, s.ipn].filter(isIns).map(num);

    } else if (DB) {

function worst(rows) {
  if (!rows.length) return 'none';
  if (rows.every(r => r.status === 'N/A')) return 'na';
  if (rows.some(r => r.status === 'FAIL')) return 'bad';
  if (rows.some(r => r.status === 'IN PROGRESS')) return 'warn';
  if (rows.every(r => r.status === 'PASS' || r.status === 'N/A')) return 'ok';
  return 'none';
}
function tabsHtml() {
  const rows = summary();
  return TABS.map(([k, l]) => {
    let d = 'none';
    if (k === 'inv') d = worst(rows.filter(r => r.key.startsWith('dc:')));
    else if (TABKEYS[k]) d = worst(rows.filter(r => TABKEYS[k].includes(r.key)));
    else if (k === 'overview' || k === 'report') d = { PASS: 'ok', FAIL: 'bad', INCOMPLETE: 'warn' }[overall(rows)];
    else if (k === 'info') d = filled(P.info.name) ? 'ok' : 'none';
    else if (k === 'serials') d = serialStatus();
    else if (k === 'photos') d = P.photos.length ? 'ok' : 'none';
